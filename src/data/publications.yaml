# The publication record. Schema: src/content.config.ts (`publications`). Restructure
# spec §3.4 for the field meanings and §4.4 for the blurb brief. Keyed by `id`, which is
# the slug of the paper page each entry replaces, where one exists; `anchor` is the
# heading id in the theme article, from the table in spec §3.6. Blurbs are written in
# each theme's session.
# Posters, the thesis and the sodium manuscript are added in session 7.

- id: graphene-potential
  kind: paper
  title: Development of a machine learning potential for graphene
  authors: [P. Rowe, G. Csányi, D. Alfè, A. Michaelides]
  venue: Phys. Rev. B 97, 054303
  year: 2018
  doi: 10.1103/PhysRevB.97.054303
  theme: carbon
  anchor: graphene-potential
  blurb: "A Gaussian approximation potential for graphene with an in-plane force error of 0.028 eV Å⁻¹ against DFT. That is twenty times below the best empirical potential, and the paper named the catch itself: the model knew one form of carbon and could not describe diamond."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/1710.04187" }
    - { label: Code, url: "https://github.com/libAtoms/QUIP" }

- id: carbon-gap-20
  kind: paper
  title: An accurate and transferable machine learning potential for carbon
  authors: [P. Rowe, V. L. Deringer, P. Gasparotto, G. Csányi, A. Michaelides]
  venue: J. Chem. Phys. 153, 034702
  year: 2020
  doi: 10.1063/5.0005084
  theme: carbon
  anchor: gap-20
  blurb: "One potential for diamond, graphite, graphene, nanotubes, fullerenes, the liquid and amorphous carbon, with lattice parameters within 0.2% of DFT on average. Covering all of it from a database of about 17,000 DFT configurations cost a factor of four in graphene phonon accuracy, 4 meV against the graphene-only model's 1, and a 1,000-structure random search said the price was right."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/2006.13655" }
    - { label: Data, url: "https://doi.org/10.17863/CAM.54529" }
    - { label: Code, url: "https://github.com/patrickwrowe/Carbon_GAP" }
    - { label: Docs, url: "https://libatoms.github.io/GAP/installation.html" }

- id: graphene-corrugation
  kind: paper
  title: Defect-dependent corrugation in graphene
  authors: [F. L. Thiemann, P. Rowe, A. Zen, E. A. Müller, A. Michaelides]
  venue: Nano Lett. 21, 8143–8150
  year: 2021
  doi: 10.1021/acs.nanolett.1c02585
  theme: carbon
  anchor: defect-corrugation
  blurb: "Point defects corrugate free-standing graphene even at a concentration of 0.2%, and the type matters. At 3% divacancies make the sheet almost five times as corrugated as pristine graphene and Stone–Wales defects almost three, and only the machine-learned potential found the divacancy reconstruction unprompted; the two classical potentials tested had to be told."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/2107.01128" }

- id: carbon-clusters
  kind: paper
  title: "Accelerating the prediction of large carbon clusters via structure search: evaluation of machine-learning and classical potentials"
  authors: [B. Karasulu, J.-M. Leyssale, P. Rowe, C. Weber, C. de Tomas]
  venue: Carbon 191, 255–266
  year: 2022
  doi: 10.1016/j.carbon.2022.01.031
  theme: carbon
  anchor: cluster-benchmark
  blurb: "GAP-20 matched the DFT minima, energies, rings and coordination of random-structure-searched carbon clusters better than every classical potential in a seven-way test. It over-bound C₆₀ by 0.10 eV per atom where the classical potentials under-bound it by 0.30 to 0.91, and then carried the search beyond DFT's reach, to 720 atoms."
  links:
    - { label: Preprint, url: "https://hal.science/hal-03832937v1" }
    - { label: Data, url: "https://github.com/bkarasulu/Carbon-PP-Benchmark-Paper-SI" }

- id: vermiculite-membranes
  kind: paper
  title: Cation-controlled wetting properties of vermiculite membranes and its promise for fouling resistant oil–water separation
  authors: [K. Huang, P. Rowe, C. Chi, V. Sreepal, T. Bohn, K.-G. Zhou, Y. Su, E. Prestat, P. Balakrishna Pillai, C. T. Cherian, A. Michaelides, R. R. Nair]
  venue: Nat. Commun. 11, 1097
  year: 2020
  doi: 10.1038/s41467-020-14854-4
  theme: two-dimensional-and-confined
  anchor: vermiculite-membranes
  blurb: "Exchanging the cation between vermiculite's layers moves its water contact angle from 15° for lithium to 101° for tin, and lithium alone is far more hydrophilic than the trend allows. The AIMD says why: potassium has 1 adsorption site and orders the contact layer; lithium has 2, and lets it relax to bulk-like water bound at −0.89 eV per molecule."

- id: hbn-rippling
  kind: paper
  title: Machine learning potential for hexagonal boron nitride applied to thermally and mechanically induced rippling
  authors: [F. L. Thiemann, P. Rowe, E. A. Müller, A. Michaelides]
  venue: J. Phys. Chem. C 124, 22278–22290
  year: 2020
  doi: 10.1021/acs.jpcc.0c05831
  theme: two-dimensional-and-confined
  anchor: boron-nitride-rippling
  blurb: "A Gaussian approximation potential for hexagonal boron nitride with a force error of 0.09 eV Å⁻¹, an order of magnitude below Tersoff, ExTeP and ReaxFF. Let loose on 7,200-atom sheets, it gives hBN the same anomalous rippling exponent as graphene, 0.82 against 0.87, a bending rigidity of 1.09 eV and a crossing to soliton-like ripples between −0.25% and −0.5% strain."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/2007.11448" }
    - { label: Data, url: "https://doi.org/10.17863/CAM.66112" }
    - { label: Code, url: "https://github.com/libAtoms/QUIP" }

- id: aqueous-potentials
  kind: paper
  title: Machine learning potentials for complex aqueous systems made simple
  authors: [C. Schran, F. L. Thiemann, P. Rowe, E. A. Müller, O. Marsalek, A. Michaelides]
  venue: Proc. Natl. Acad. Sci. U.S.A. 118, e2110077118
  year: 2021
  doi: 10.1073/pnas.2110077118
  theme: two-dimensional-and-confined
  anchor: aqueous-potentials
  blurb: "Committee neural network potentials for 6 systems, water at ions, in nanotubes and on MoS₂ and TiO₂, each built from a single short AIMD run and converged at roughly 300 training structures. They cost 4 to 5 orders of magnitude less than the DFT they came from, and the TiO₂ model ran 1,728 atoms for 5 ns where its AIMD had 30 ps."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/2106.00048" }
    - { label: Code, url: "https://github.com/MarsalekGroup/aml" }
    - { label: Data, url: "https://doi.org/10.5281/zenodo.5235246" }

- id: nanotube-water-flow
  kind: paper
  title: "Water flow in single-wall nanotubes: oxygen makes it slip, hydrogen makes it stick"
  authors: [F. L. Thiemann, C. Schran, P. Rowe, E. A. Müller, A. Michaelides]
  venue: ACS Nano 16, 10775–10782
  year: 2022
  doi: 10.1021/acsnano.2c02784
  theme: two-dimensional-and-confined
  anchor: nanotube-water-flow
  blurb: "Water's friction on hexagonal boron nitride is about 4–5 times that on carbon at every curvature, from 16 nanotubes and 2 sheets run for over 40 ns on committee neural network potentials trained to revPBE-D3. The radius dependence is oxygen's and the material dependence is hydrogen's, which docks on nitrogen and hops: oxygen makes water slip, hydrogen makes it stick."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/2202.04955" }
    - { label: Code, url: "https://github.com/MarsalekGroup/aml" }

- id: mos2-membranes
  kind: paper
  title: pH-dependent water permeability switching and its memory in MoS₂ membranes
  authors: [C. Hu, A. Achari, P. Rowe, H. Xiao, S. Suran, Z. Li, K. Huang, C. Chi, C. T. Cherian, V. Sreepal, P. D. Bentley, A. Pratt, N. Zhang, K. S. Novoselov, A. Michaelides, R. R. Nair]
  venue: Nature 616, 719–723
  year: 2023
  doi: 10.1038/s41586-023-05849-4
  theme: two-dimensional-and-confined
  anchor: molybdenum-disulfide-membranes
  blurb: "A restacked MoS₂ membrane shuts to water below about pH 4 and opens above about pH 11, remembers which, and collapses from 11.4 to 6.4 Å once its surface sulfur is protonated. AIMD at 2 lithium loadings found the same water bilayer and no substantial difference in diffusion, so lithium alone does not set the permeation; classical MD showed it sets the entry."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/2301.10195" }

- id: excitonic-interactions
  kind: paper
  title: Importance and nature of short-range excitonic interactions in light harvesting complexes and organic semiconductors
  authors: [R. P. Fornari, P. Rowe, D. Padula, A. Troisi]
  venue: J. Chem. Theory Comput. 13, 3754–3763
  year: 2017
  doi: 10.1021/acs.jctc.7b00328
  theme: excited-states
  anchor: excitonic-interactions
  blurb: "Two chromophores in van der Waals contact have a short-range coupling the Coulombic formulas discard: up to 28% of the total in FMO and 66% in a stacked zinc phthalocyanine column. Beyond 7 Å the Coulombic coupling is the coupling to about 10%, the licence every cheap transport model runs on; the point-dipole formula misses 67% of it at 6 Å."
  links:
    - { label: Preprint, url: "http://wrap.warwick.ac.uk/98549" }

- id: multichromophore-dynamics
  kind: paper
  title: Structure–dynamics relation in physically plausible multi-chromophore systems
  authors: [G. C. Knee, P. Rowe, L. D. Smith, A. Troisi, A. Datta]
  venue: J. Phys. Chem. Lett. 8, 2328–2333
  year: 2017
  doi: 10.1021/acs.jpclett.7b00829
  theme: excited-states
  anchor: multichromophore-dynamics
  blurb: "Nature's arrangement of FMO's 8 bacteriochlorophylls ranks 466th of 50,000 physically plausible rearrangements for exciton transport at 4 ps, of the order of 20 percentage points above the ensemble. Compact structures with a pigment between source and drain do best; perturbing the Hamiltonian element by element, the earlier method, ranks nature's as generic because it builds no alternative."
  links:
    - { label: Preprint, url: "https://arxiv.org/abs/1704.01795" }
    - { label: Data, url: "https://doi.org/10.6084/m9.figshare.c.3784874.v1" }

- id: cd3-binder-selection
  kind: poster
  title: A rational approach for selecting CD3-binding antibodies for T-cell engager development
  authors: [V. de Puyraimond, P. Rowe, J. Mai, P. Pouliot, K. Caldwell, L. Clifford, A. Goodman, P. Farber, H. Dhupar, D. Tortora, P. Bergqvist, J. Reimer, K. Herve, V. Li, I. Yu, J. Marwick, S. Carrarra, N. Blamey, M. Cid, C.-L. Crichlow, L. M. Bolten, T. Pinsky, G. Volkers, J. Fernandes Scortecci, G. Bodhankar, C. De Jong, S. Cullen, P. Xiang, C. Lai, A. Lee, G. Conaghan, A. Samiotakis, S. Hannie, R. Chappell, E. Lathouwers, L. Chong, K. Gibson, S. K. Masterman, K. Brown, K. Bullock, R. Tonikian, L. DeVorkin, S. Duncan, A. Yamniuk, K. Dalal, T. M. Jacobs, B. C. Barnhart]
  venue: J. Immunother. Cancer 11 (Suppl 1), A1523
  year: 2023
  doi: 10.1136/jitc-2023-SITC2023.1367
  theme: antibodies
  anchor: cd3-binder-selection
  blurb: "Binding kinetics alone do not predict what a T-cell engager does, and clustering a CD3-binder portfolio on killing and cytokine profiles instead resolves it into 19 functional clusters. Selecting across those clusters rather than inside a favourite one carried two programmes, against PSMA and MAGE-A4, from more than 380 bispecifics to lead panels of 9 and 12."

- id: tce-pmhc
  kind: poster
  title: Discovery and development of functional and specific T-cell engagers against a MAGE-A4 pMHC
  authors: [D. Tortora, P. Bergqvist, T. Jacobs, P. Farber, R. Blackler, A. Samiotakis, H. Dhupar, A. Goodman, C.-L. Crichlow, M. Cid, J. Fernandes Scortecci, R. Goya, L. Chong, K. Gibson, E. Solano Salgado, P. Xiang, A. Lee, I. Yu, N. Blamey, G. Conaghan, V. de Puyraimond, C. Robb, F. Li, C. Briercliffe, P. Rowe, K. Dalal, S. Masterman, T. Fernandez, K. Bullock, R. Tonikian, B. C. Barnhart]
  venue: J. Immunother. Cancer 11 (Suppl 1), A1550
  year: 2023
  doi: 10.1136/jitc-2023-SITC2023.1395
  theme: antibodies
  anchor: mage-a4-engagers
  blurb: "Discovery against a MAGE-A4 peptide on MHC class I gave 6 antibody arms, none of them affinity-matured, which paired with 19 CD3 arms into more than 200 bispecifics and 12 worth characterising. Cryo-electron microscopy at 2.7 to 3.3 Å shows the arms reading the peptide rather than its housing, approaching at diverse angles with the weight of recognition on one solvent-exposed arginine. Author."
