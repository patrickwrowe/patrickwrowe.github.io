# CV content, transcribed from my CV; the `current` entry postdates the PDF.
#
# Periods are kept as free strings rather than parsed dates because the source CV mixes
# precision ("May 2022 – Oct 2024" but also "2016 – 2020"), and forcing a common format
# would assert precision the record does not have.

name: Patrick Rowe
postnominals: PhD
statement: Machine learning for molecules, materials and proteins.

about: >-
  An experienced researcher with a strong background in machine learning, physics and
  chemistry, specialising in developing computational models for real-world scientific
  challenges. I'm looking for a role where I can apply my combined experience in AI/ML
  and scientific research to the most exciting and challenging problems of today.

current:
  role: Machine Learning Engineer
  org: SandboxAQ
  period: Jan 2026 – present
  focus: >-
    Small-molecule property prediction, ML engineering for drug discovery, protein
    language modelling.

experience:
  - role: "Research Scientist: Protein Engineering"
    org: AbCellera Biologics
    location: Canada
    period: May 2022 – Oct 2024
    points:
      - Developed AI and simulation-driven workflows for selection and engineering of
        antibodies, targeting discovery of viable therapeutic molecules. Led team
        training, deployment and execution for >30 clinical targets, spanning early
        screening to final delivery.
      - Worked cross-functionally to implement data architecture and automated
        processing pipelines supporting integration and downstream analysis of lab
        automation data in internal databases.
      - Engaged directly with major pharmaceutical partners to understand their needs,
        translate them into actionable selection strategies and deliver therapeutic
        candidate molecules, securing key contract milestones.

  - role: Industrial Research Fellow
    org: University of Cambridge and Happy Electron
    location: UK
    period: Jan 2021 – Mar 2022
    points:
      - Designed specialised machine learning interatomic potentials for energy
        materials, offering mechanistic insights into experimentally observed physical
        properties.
      - Led collaborations with international experimental research teams, connecting
        modelling with practical applications.

  - role: PhD Physics
    org: University College London
    location: UK
    period: 2016 – 2020
    points:
      - Primary research on the development of machine learning techniques for atomistic
        modelling. Created GAP-20, a world-leading machine learning atomistic potential
        for carbon, adopted widely in academia and industry, where selected applications
        include structure searching, phase-diagram prediction and studying
        graphitisation.
      - Contributed to creating a machine learning framework for modelling complex
        solid–liquid interfaces, facilitating the rapid and robust development of
        accurate simulation models.
      - Led cross-disciplinary collaborations between UCL and experimentalists at the
        National Graphene Institute, resulting in high-impact publications (Nature and
        Nature Communications).
      - Presented invited and contributed talks at international conferences. Awarded
        prizes for best poster and presentation. Research featured on the front cover of
        UCL's 2020 physics prospectus.

  - role: Research Placement (full time)
    org: DSM Speciality Resins
    location: Zwolle, Netherlands
    period: 2014 – 2015
    points:
      - Developed a 96% bio-renewable alternative to traditional petrochemical-based
        polymer alkyd coatings.

